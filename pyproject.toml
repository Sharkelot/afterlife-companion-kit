[project]
name = "afterlife-companion-kit"
version = "0.1.0"
description = "Self-hostable website guide widget and experimental companion API"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1",
  "httpx>=0.27,<1",
  "numpy>=1.26,<3",
  "pydantic>=2.7,<3",
  "python-multipart>=0.0.9",
  "PyYAML>=6,<7",
  "uvicorn>=0.30,<1",
]

[tool.pytest.ini_options]
testpaths = ["guide-service/tests", "guide-service/widget/tests", "tools/concept"]
python_files = ["test_*.py"]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
